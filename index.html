<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Panda Mission | 登录</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <div id="topbar" class="topbar"></div>
    <div id="toast" class="notice" style="display:none;margin-top:14px"></div>
    
  <div class="grid">
    <div class="card half">
      <h2 data-i18n-zh="登录" data-i18n-en="Log in">登录</h2>
      <p class="muted" data-i18n-zh="给学生用：注册后即可开始 1-6 章任务。进度保存在当前浏览器。" data-i18n-en="For students: register and start Chapters 1–6. Progress is saved in this browser.">给学生用：注册后即可开始 1-6 章任务。进度保存在当前浏览器。</p>
      <label data-i18n-zh="用户名" data-i18n-en="Username">用户名</label>
      <input id="loginUser" placeholder="e.g., alice"/>
      <label data-i18n-zh="密码" data-i18n-en="Password">密码</label>
      <input id="loginPass" type="password" placeholder="••••••••"/>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="loginBtn" data-i18n-zh="登录" data-i18n-en="Log in">登录</button>
        <button class="btn" id="goRegister" data-i18n-zh="没有账号？去注册" data-i18n-en="No account? Register">没有账号？去注册</button>
      </div>
      <hr/>
      <div class="notice">
        <div style="font-weight:800;margin-bottom:6px" data-i18n-zh="提示" data-i18n-en="Note">提示</div>
        <div class="muted" data-i18n-zh="GitHub Pages 是静态站，不能真正“隐藏”密码；管理员入口只是基础保护（不在页面明示 + 登录校验）。" data-i18n-en="GitHub Pages is static—passwords cannot be truly hidden. Admin access here is basic protection (not advertised + login check).">GitHub Pages 是静态站，不能真正“隐藏”密码；管理员入口只是基础保护（不在页面明示 + 登录校验）。</div>
      </div>
    </div>

    <div class="card half" id="registerCard" style="display:none">
      <h2 data-i18n-zh="注册" data-i18n-en="Register">注册</h2>
      <p class="muted" data-i18n-zh="注册仅在当前浏览器有效（换设备需要重新注册）。" data-i18n-en="Registration is stored only in this browser (switching devices requires re-registering).">注册仅在当前浏览器有效（换设备需要重新注册）。</p>
      <label data-i18n-zh="用户名" data-i18n-en="Username">用户名</label>
      <input id="regUser" placeholder="e.g., alice"/>
      <label data-i18n-zh="密码" data-i18n-en="Password">密码</label>
      <input id="regPass" type="password" placeholder="至少 6 位 / 6+ chars"/>
      <div class="row" style="margin-top:14px">
        <button class="btn gold" id="registerBtn" data-i18n-zh="创建账号" data-i18n-en="Create account">创建账号</button>
        <button class="btn" id="goLogin" data-i18n-zh="已有账号？去登录" data-i18n-en="Have an account? Log in">已有账号？去登录</button>
      </div>
    </div>

    <div class="card third">
      <h2 data-i18n-zh="怎么使用" data-i18n-en="How it works">怎么使用</h2>
      <p class="muted" data-i18n-zh="1) 注册 → 2) 进入总地图 → 3) 依次完成 1-6 章。" data-i18n-en="1) Register → 2) Dashboard → 3) Finish Chapters 1–6.">1) 注册 → 2) 进入总地图 → 3) 依次完成 1-6 章。</p>
      <div class="kv">
        <div class="item">📌 <span data-i18n-zh="进度本地保存" data-i18n-en="Local progress">进度本地保存</span></div>
        <div class="item">🌏 <span data-i18n-zh="中英文切换" data-i18n-en="ZH/EN toggle">中英文切换</span></div>
        <div class="item">🧩 <span data-i18n-zh="每章一个小游戏" data-i18n-en="Mini-game per chapter">每章一个小游戏</span></div>
      </div>
      <hr/>
      <button class="btn" id="adminBtn" style="width:100%">🔒 <span data-i18n-zh="管理员登录" data-i18n-en="Admin login">管理员登录</span></button>
      <p class="muted" style="margin-top:10px" data-i18n-zh="管理员入口不公开链接；只有知道账号密码的人能进去。" data-i18n-en="Admin page isn't linked publicly; only those with credentials can enter.">管理员入口不公开链接；只有知道账号密码的人能进去。</p>
    </div>
  </div>
  
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div id="modalBox"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="index.js"></script>
</body>
</html>
