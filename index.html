<!-- Standalone mode: lightweight SDK stubs (localStorage) -->
<script>
  // This file was adapted to run as a standalone web page (no Canva runtime required).
  // Data is stored locally in the browser (per-device). For multi-device/classroom sync, use a real backend later.

  (function () {
    const STORAGE_KEY = "chengdu_mission_records_v1";

    function safeLoad() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch (e) {
        console.warn("Failed to load local data:", e);
        return [];
      }
    }

    function safeSave(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn("Failed to save local data:", e);
      }
    }

    function makeId() {
      return "rec_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    }

    let handler = null;
    let records = safeLoad();

    // Minimal dataSdk compatible with the code below
    window.dataSdk = {
      async init(h) {
        handler = h || null;
        // Immediately send current data to the app
        if (handler && typeof handler.onDataChanged === "function") {
          handler.onDataChanged(records);
        }
        return { isOk: true };
      },
      async create(record) {
        const rec = { _id: makeId(), ...record };
        records = [...records, rec];
        safeSave(records);
        if (handler && typeof handler.onDataChanged === "function") {
          handler.onDataChanged(records);
        }
        return { isOk: true, record: rec };
      },
      async update(record) {
        if (!record) return { isOk: false, error: "No record provided" };
        const idx = records.findIndex(r => r._id && record._id && r._id === record._id);
        let next = records.slice();

        if (idx >= 0) {
          next[idx] = { ...records[idx], ...record };
        } else {
          // Fallback matching if _id missing
          const idx2 = records.findIndex(r =>
            r.record_type === record.record_type &&
            r.user_id === record.user_id &&
            (
              (record.record_type === "user" && r.user_id === record.user_id) ||
              (record.task_id && r.task_id === record.task_id) ||
              (record.question_id && r.question_id === record.question_id)
            )
          );
          if (idx2 >= 0) {
            next[idx2] = { ...records[idx2], ...record };
          } else {
            // If not found, create it
            next.push({ _id: makeId(), ...record });
          }
        }

        records = next;
        safeSave(records);
        if (handler && typeof handler.onDataChanged === "function") {
          handler.onDataChanged(records);
        }
        return { isOk: true };
      }
    };

    // Minimal elementSdk stub (keeps your customization panel logic harmless outside Canva)
    window.elementSdk = {
      config: {},
      _onConfigChange: null,
      init({ defaultConfig, onConfigChange }) {
        this.config = { ...(defaultConfig || {}) };
        this._onConfigChange = (typeof onConfigChange === "function") ? onConfigChange : null;
        if (this._onConfigChange) this._onConfigChange(this.config);
      },
      setConfig(partial) {
        this.config = { ...this.config, ...(partial || {}) };
        if (this._onConfigChange) this._onConfigChange(this.config);
      }
    };
  })();
</script>

      secondary_action_color: "#10b981",
      font_family: "Fredoka",
      font_size: 16
    };

    let currentPage = 'auth';
    let currentUser = null;
    let quizAnswers = {};
    let pandaBodyParts = {};
    let conservationChecklist = [];
    let artifactMatches = {};
    let archaeologyClues = {};
    let userArtifact = '';
    let completedTasks = new Set();
    let earnedBadges = new Set();
    let wrongAnswers = [];
    let allData = [];
    let isLoading = false;
    let adminDashboardTab = 'overview';
    let searchQuery = '';
    let filterStatus = 'all';
    let selectedUserId = null;
    let selectedArtifact = null;

    const ADMIN_EMAIL = 'admin@chengdu.com';
    const ADMIN_PASSWORD = 'admin123';

    const dataHandler = {
      onDataChanged(data) {
        allData = data;
        
        if (currentUser) {
          updateLastActive();
          loadUserProgress();
        }

        if (currentPage.startsWith('admin-')) {
          renderAdminDashboard();
        }
      }
    };

    async function updateLastActive() {
      if (!currentUser) return;

      const userRecord = allData.find(r => 
        r.record_type === 'user' && 
        r.user_id === currentUser.id
      );

      if (userRecord) {
        const updated = { 
          ...userRecord, 
          last_active: new Date().toISOString()
        };
        await window.dataSdk.update(updated);
      }
    }

    function loadUserProgress() {
      completedTasks.clear();
      earnedBadges.clear();
      wrongAnswers = [];
      
      const userRecords = allData.filter(r => r.user_id === currentUser.id);
      
      userRecords.forEach(record => {
        if (record.record_type === 'task' && record.completed) {
          completedTasks.add(record.task_id);
        } else if (record.record_type === 'badge') {
          earnedBadges.add(record.task_id);
        } else if (record.record_type === 'wrong_answer') {
          wrongAnswers.push({
            question_id: record.question_id,
            timestamp: record.timestamp
          });
        }
      });
      
      updateProgressBar();
      if (currentPage === 'home') {
        renderHomePage();
      }
    }

    async function saveTaskCompletion(taskId, userInput = '') {
      if (!currentUser) {
        showLoginPrompt();
        return;
      }

      if (allData.length >= 999) {
        showToast('数据已达上限，无法保存新任务', 'error');
        return;
      }

      const existingRecord = allData.find(r => 
        r.user_id === currentUser.id && 
        r.record_type === 'task' && 
        r.task_id === taskId
      );
      
      if (existingRecord) {
        const updated = { 
          ...existingRecord, 
          completed: true, 
          timestamp: new Date().toISOString(), 
          user_input: userInput 
        };
        const result = await window.dataSdk.update(updated);
        if (!result.isOk) {
          showToast('保存失败，请重试', 'error');
        }
      } else {
        const result = await window.dataSdk.create({
          record_type: 'task',
          user_id: currentUser.id,
          task_id: taskId,
          completed: true,
          timestamp: new Date().toISOString(),
          user_input: userInput,
          nickname: '',
          email: '',
          password: '',
          school: '',
          class_name: '',
          parent_email: '',
          class_code: '',
          is_teacher: false,
          is_admin: false,
          score: 0,
          question_id: '',
          is_correct: false,
          last_active: ''
        });
        if (!result.isOk) {
          showToast('保存失败，请重试', 'error');
        }
      }
    }

    async function saveBadge(badgeId) {
      if (!currentUser || allData.length >= 999) return;

      const existingBadge = allData.find(r => 
        r.user_id === currentUser.id && 
        r.record_type === 'badge' && 
        r.task_id === badgeId
      );

      if (!existingBadge) {
        await window.dataSdk.create({
          record_type: 'badge',
          user_id: currentUser.id,
          task_id: badgeId,
          completed: true,
          timestamp: new Date().toISOString(),
          user_input: '',
          nickname: '',
          email: '',
          password: '',
          school: '',
          class_name: '',
          parent_email: '',
          class_code: '',
          is_teacher: false,
          is_admin: false,
          score: 0,
          question_id: '',
          is_correct: false,
          last_active: ''
        });
      }
    }

    async function saveWrongAnswer(questionId) {
      if (!currentUser || allData.length >= 999) return;

      await window.dataSdk.create({
        record_type: 'wrong_answer',
        user_id: currentUser.id,
        task_id: '',
        completed: false,

        email: '',

        class_code: '',

        score: 0,

        is_correct: false,

    function showToast(message, type = 'success') {

      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    function updateProgressBar() {
      const totalTasks = 6;

      if (progressBar) {
        progressBar.style.width = percentage + '%';

      if (progressText) {
        progressText.textContent = `${percentage}%`;
      }
    }

                      <label for="register-class-code" class="block text-content font-medium mb-2" style="color: ${config.text_color || defaultConfig.text_color}; font-size: ${config.font_size || defaultConfig.font_size}px;">班级码（可选）</label>

                  </div>

                  <button type="submit" id="auth-submit-btn" class="btn-primary w-full py-3 rounded-full font-bold text-white" style="background-color: ${config.primary_action_color || defaultConfig.primary_action_color}; font-size: ${(config.font_size || defaultConfig.font_size) * 1.1}px;">登录</button>

              <div class="text-center space-y-2">
                <button onclick="createTeacherAccount()" class="text-content underline opacity-80 block w-full" style="color: ${config.text_color || defaultConfig.text_color}; font-size: ${(config.font_size || defaultConfig.font_size) * 0.9}px;">我是老师，创建班级</button>

              <p class="text-content text-sm text-center opacity-80" style="color: ${config.text_color || defaultConfig.text_color};">🔒 隐私保护：我们仅收集必要的学习进度数据，用于教学管理。您的数据安全存储，不会与他人共享。</p>

    }

    function switchAuthTab(tab) {
      const config = window.elementSdk.config;
      const loginTab = document.getElementById('login-tab');
      const registerTab = document.getElementById('register-tab');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const submitBtn = document.getElementById('auth-submit-btn');

      if (tab === 'login') {
        loginTab.style.backgroundColor = config.primary_action_color || defaultConfig.primary_action_color;
        loginTab.style.color = 'white';
        registerTab.style.backgroundColor = '#e5e7eb';
        registerTab.style.color = '#6b7280';
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        submitBtn.textContent = '登录';
      } else {
        registerTab.style.backgroundColor = config.primary_action_color || defaultConfig.primary_action_color;
        registerTab.style.color = 'white';
        loginTab.style.backgroundColor = '#e5e7eb';
        loginTab.style.color = '#6b7280';
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        submitBtn.textContent = '注册';
      }
    }

    async function handleAuth(event) {
      event.preventDefault();
      
      if (isLoading) return;
      isLoading = true;

      const submitBtn = document.getElementById('auth-submit-btn');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = '处理中...';

      const loginForm = document.getElementById('login-form');
      const isLogin = !loginForm.classList.contains('hidden');

      try {
        if (isLogin) {
          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;

          if (!email || !password) {
            showToast('请填写完整信息', 'error');
            return;
          }

          const userRecord = allData.find(r => 
            r.record_type === 'user' && 
            r.email === email && 
            r.password === password
          );

          if (userRecord) {
            currentUser = {
              id: userRecord.user_id,
              nickname: userRecord.nickname,
              email: userRecord.email,
              school: userRecord.school,
              class_name: userRecord.class_name,
              is_teacher: userRecord.is_teacher,
              is_admin: userRecord.is_admin || false
            };
            showToast('登录成功！', 'success');
            loadUserProgress();
            navigateTo('home');
          } else {
            showToast('邮箱或密码错误', 'error');
          }
        } else {
          const nickname = document.getElementById('register-nickname').value.trim();
          const email = document.getElementById('register-email').value.trim();
          const password = document.getElementById('register-password').value;
          const school = document.getElementById('register-school').value.trim();
          const className = document.getElementById('register-class').value.trim();
          const parentEmail = document.getElementById('register-parent-email').value.trim();
          const classCode = document.getElementById('register-class-code').value.trim();

          if (!nickname || !email || !password) {
            showToast('请填写必填项（昵称、邮箱、密码）', 'error');
            return;
          }

          if (password.length < 6) {
            showToast('密码至少需要6位', 'error');
            return;
          }

          const existingUser = allData.find(r => 
            r.record_type === 'user' && 
            r.email === email
          );

          if (existingUser) {
            showToast('该邮箱已被注册', 'error');
            return;
          }

          if (allData.length >= 999) {
            showToast('系统用户已达上限', 'error');
            return;
          }

          const userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

          const result = await window.dataSdk.create({
            record_type: 'user',
            user_id: userId,
            task_id: '',
            completed: false,
            timestamp: new Date().toISOString(),
            user_input: '',
            nickname: nickname,
            email: email,
            password: password,
            school: school,
            class_name: className,
            parent_email: parentEmail,
            class_code: classCode,
            is_teacher: false,
            is_admin: false,
            score: 0,
            question_id: '',
            is_correct: false,
            last_active: new Date().toISOString()
          });

          if (result.isOk) {
            currentUser = {
              id: userId,
              nickname: nickname,
              email: email,
              school: school,
              class_name: className,
              is_teacher: false,
              is_admin: false
            };
            showToast('注册成功！', 'success');
            loadUserProgress();
            navigateTo('home');
          } else {
            showToast('注册失败，请重试', 'error');
          }
        }
      } finally {
        isLoading = false;
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }

                      ${badge === 'panda-expert' ? '🐼 熊猫专家' : badge === 'conservation-hero' ? '🌿 保护英雄' : badge === 'sanxingdui-explorer' ? '🗿 三星堆探索者' : '🔍 小小考古学家'}
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
              <div class="task-card surface rounded-3xl p-6 shadow-lg cursor-pointer" style="background: linear-gradient(135deg, ${config.surface_color || defaultConfig.surface_color} 0%, #dcfce7 100%);">

                <h3 class="panda-card-title text-xl font-bold mb-2 text-center" style="color: ${config.text_color || defaultConfig.text_color}; font-size: ${(config.font_size || defaultConfig.font_size) * 1.25}px;">${config.panda_card_title || defaultConfig.panda_card_title}</h3>
                <p class="text-content text-center mb-4 opacity-80" style="color: ${config.text_color || defaultConfig.text_color}; font-size: ${(config.font_size || defaultConfig.font_size) * 0.9}px;">认识大熊猫 + 保护行动</p>
                <div class="flex justify-center gap-2 mb-4">
                  <span class="px-3 py-1 rounded-full text-xs font-medium" style="background-color: ${completedTasks.has('panda-quiz') ? config.secondary_action_color || defaultConfig.secondary_action_color : '#e5e7eb'}; color: white;">任务1</span>

                </div>
                <button class="btn-primary w-full py-3 rounded-full font-bold text-white" style="background-color: ${config.primary_action_color || defaultConfig.primary_action_color}; font-size: ${(config.font_size || defaultConfig.font_size) * 1.1}px;">开始任务 →</button>
              </div>

              <div class="task-card surface rounded-3xl p-6 shadow-lg cursor-pointer" style="background: linear-gradient(135deg, ${config.surface_color || defaultConfig.surface_color} 0%, #fef3c7 100%);">

                  <span class="px-3 py-1 rounded-full text-xs font-medium" style="background-color: ${completedTasks.has('archaeology-lab') ? config.secondary_action_color || defaultConfig.secondary_action_color : '#e5e7eb'}; color: white;">任务4</span>

    function logout() {
      currentUser = null;
      completedTasks.clear();
      earnedBadges.clear();
      wrongAnswers = [];
      showToast('已退出登录', 'success');
      navigateTo('auth');
    }

    function navigateTo(page) {
      currentPage = page;
      
      if (page === 'auth') {
        renderAuthPage();
      } else if (page === 'home') {
        if (!currentUser) {
          showLoginPrompt();
          renderAuthPage();
          return;
        }
        renderHomePage();
      }
    }

    async function init() {
      const initResult = await window.dataSdk.init(dataHandler);
      if (!initResult.isOk) {
        console.error('Failed to initialize data SDK');
        return;
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.background_color || defaultConfig.background_color,
                set: (value) => {
                  config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => config.surface_color || defaultConfig.surface_color,
                set: (value) => {
                  config.surface_color = value;
                  window.elementSdk.setConfig({ surface_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                set: (value) => {
                  config.primary_action_color = value;
                  window.elementSdk.setConfig({ primary_action_color: value });
                }
              },
              {
                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                set: (value) => {
                  config.secondary_action_color = value;
                  window.elementSdk.setConfig({ secondary_action_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: {
              get: () => config.font_family || defaultConfig.font_family,
              set: (value) => {
                config.font_family = value;
                window.elementSdk.setConfig({ font_family: value });
              }
            },
            fontSizeable: {
              get: () => config.font_size || defaultConfig.font_size,
              set: (value) => {
                config.font_size = value;
                window.elementSdk.setConfig({ font_size: value });
              }
            }
          }),
          mapToEditPanelValues: (config) => new Map([
            ['site_title', config.site_title || defaultConfig.site_title],
            ['site_subtitle', config.site_subtitle || defaultConfig.site_subtitle],
            ['main_heading', config.main_heading || defaultConfig.main_heading],
            ['panda_card_title', config.panda_card_title || defaultConfig.panda_card_title],
            ['sanxingdui_card_title', config.sanxingdui_card_title || defaultConfig.sanxingdui_card_title]
          ])
        });
      }

      renderAuthPage();
    }

    init();
  </script>
